<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>参加登録 — Awign Japan</title>
<meta name="description" content="Awign（マイナビグループ）在宅の家事撮影ワークの参加登録フォームです。登録後にLINE公式アカウントをご案内します。" />
<link rel="icon" href="assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="join.css" />
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("awign_theme"); } catch (e) {}
    document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
  })();
</script>
</head>
<body>

<nav class="nav">
  <div class="shell nav__in">
    <a class="brand" href="index.html"><img src="assets/logo.png" alt="Awign" /></a>
    <div class="nav__tools">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" id="l-ja" class="on" lang="ja"><span class="l-full">日本語</span><span class="l-short">JA</span></button>
        <button type="button" id="l-en" lang="en"><span class="l-full">English</span><span class="l-short">EN</span></button>
      </div>
      <button type="button" class="iconbtn" id="theme-btn" aria-label="Switch theme">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</nav>

<main class="shell join">

  <ol class="jsteps" aria-label="Progress">
    <li class="on" id="js1"><span>1</span><b data-t="step1"></b></li>
    <li class="bar" aria-hidden="true"></li>
    <li id="js2"><span>2</span><b data-t="step2"></b></li>
  </ol>

  <!-- ============ STEP 1: FORM ============ -->
  <section id="view-form">
    <h1 data-t="h1"></h1>
    <p class="join__lede" data-t="lede"></p>

    <div class="jnote" id="preview-note" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
      <span data-t="preview"></span>
    </div>

    <form class="jcard" id="form" novalidate>
      <!-- honeypot: real people never see or fill this -->
      <div class="hp" aria-hidden="true"><label>Website <input type="text" name="website" id="i-website" tabindex="-1" autocomplete="off" /></label></div>

      <div class="jf" id="f-name">
        <label for="i-name"><span data-t="lName"></span><em data-t="req"></em></label>
        <input id="i-name" type="text" autocomplete="name" placeholder="山田 花子" />
        <p class="jerr" data-t="eReq"></p>
      </div>

      <div class="jf" id="f-kana">
        <label for="i-kana"><span data-t="lKana"></span></label>
        <input id="i-kana" type="text" autocomplete="off" placeholder="ヤマダ ハナコ" />
        <p class="jhint" data-t="hKana"></p>
        <p class="jerr" data-t="eKana"></p>
      </div>

      <div class="jf" id="f-email">
        <label for="i-email"><span data-t="lEmail"></span><em data-t="req"></em></label>
        <input id="i-email" type="email" autocomplete="email" inputmode="email" spellcheck="false" placeholder="hanako@example.com" />
        <p class="jhint" data-t="hEmail"></p>
        <p class="jerr" data-t="eEmail"></p>
      </div>

      <div class="jf" id="f-phone">
        <label for="i-phone"><span data-t="lPhone"></span><em data-t="req"></em></label>
        <input id="i-phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="090-1234-5678" />
        <p class="jhint" data-t="hPhone"></p>
        <p class="jerr" data-t="ePhone"></p>
      </div>

      <div class="jf" id="f-pref">
        <label for="i-pref"><span data-t="lPref"></span><em data-t="req"></em></label>
        <select id="i-pref"></select>
        <p class="jerr" data-t="eReq"></p>
      </div>

      <fieldset class="jf" id="f-device">
        <legend><span data-t="lDevice"></span><em data-t="req"></em></legend>
        <div class="jopts" id="o-device"></div>
        <p class="jhint" data-t="hDevice"></p>
        <p class="jerr" data-t="eChoose"></p>
      </fieldset>

      <fieldset class="jf" id="f-mount">
        <legend><span data-t="lMount"></span><em data-t="req"></em></legend>
        <div class="jopts" id="o-mount"></div>
        <p class="jhint" data-t="hMount"></p>
        <p class="jerr" data-t="eChoose"></p>
      </fieldset>

      <fieldset class="jf jagree" id="f-agree">
        <legend data-t="lAgree"></legend>
        <label class="jcheck"><input type="checkbox" id="c-terms" /><span id="t-terms"></span></label>
        <label class="jcheck"><input type="checkbox" id="c-privacy" /><span id="t-privacy"></span></label>
        <label class="jcheck"><input type="checkbox" id="c-age" /><span data-t="cAge"></span></label>
        <p class="jerr" data-t="eAgree"></p>
      </fieldset>

      <button type="submit" class="btn btn--line jsubmit" id="submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
        <span data-t="submit"></span>
      </button>
      <p class="jnote jnote--bad" id="save-err" hidden><span data-t="eSave"></span></p>
    </form>
  </section>

  <!-- ============ STEP 2: DONE + LINE ============ -->
  <section id="view-done" hidden>
    <div class="jcard jdone">
      <div class="jtick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg></div>
      <h1 data-t="dH"></h1>
      <p class="join__lede" data-t="dP"></p>

      <a class="btn btn--line jline" id="line-btn" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5C6.2 2.5 1.5 6.3 1.5 11c0 4.2 3.7 7.7 8.8 8.4.3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1 .9.6 1.1-.5 6-3.5 8.2-6.1 1.5-1.7 2.3-3.4 2.3-5.3 0-4.7-4.7-8.5-10.5-8.5zM8 13.7H5.9c-.3 0-.6-.3-.6-.6V8.9c0-.3.3-.6.6-.6s.6.3.6.6v3.6H8c.3 0 .6.3.6.6s-.3.6-.6.6zm2.2-.6c0 .3-.3.6-.6.6s-.6-.3-.6-.6V8.9c0-.3.3-.6.6-.6s.6.3.6.6v4.2zm5 0c0 .3-.2.5-.4.6h-.2c-.2 0-.4-.1-.5-.2l-2.1-2.9v2.6c0 .3-.3.6-.6.6s-.6-.3-.6-.6V8.9c0-.3.2-.5.4-.6h.2c.2 0 .4.1.5.3l2.1 2.9V8.9c0-.3.3-.6.6-.6s.6.3.6.6v4.2zm3.4-2.7c.3 0 .6.3.6.6s-.3.6-.6.6H17v1.1h1.6c.3 0 .6.3.6.6s-.3.6-.6.6h-2.2c-.3 0-.6-.3-.6-.6V8.9c0-.3.3-.6.6-.6h2.2c.3 0 .6.3.6.6s-.3.6-.6.6H17v1.1h1.6z"/></svg>
        <span data-t="dLine"></span>
      </a>

      <div class="jqr">
        <img src="assets/line-qr.svg" alt="LINE QR" width="168" height="168" />
        <div>
          <b data-t="dQrT"></b>
          <p data-t="dQr"></p>
          <p class="jid">ID: <span id="line-id"></span></p>
        </div>
      </div>

      <ol class="jnext">
        <li data-t="dN1"></li>
        <li data-t="dN2"></li>
        <li data-t="dN3"></li>
      </ol>

      <a class="btn btn--ghost jback" href="index.html#start" data-t="dGuide"></a>
      <button type="button" class="jlink" id="again" data-t="dAgain"></button>
    </div>
  </section>

  <div class="jcontact">
    <b data-t="cT"></b>
    <p><span data-t="cP"></span></p>
    <p>
      <a id="c-mail"></a><br />
      <a id="c-tel"></a> <span class="jmuted" data-t="cIntl"></span>
    </p>
  </div>
</main>

<footer class="foot">
  <div class="foot__bar"><span data-t="rights"></span> · <a href="privacy.html" data-t="fPrivacy"></a> · <a href="terms.html" data-t="fTerms"></a></div>
</footer>

<script src="i18n.js"></script>
<script src="join.js"></script>
</body>
</html>
